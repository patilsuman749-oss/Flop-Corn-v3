apply plugin: 'com.android.application'

android {
    namespace 'com.flopcorn.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.flopcorn.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
